name: ci

on:
  # PR only (2026-10-15): main takes rebase merges of PRs that the required checks hold green and
  # up to date, so a push run would retest the same tree.
  pull_request:

jobs:
  test:
    strategy:
      # One OS failing must not cancel the other: PR #75's Windows leg was cancelled and reported nothing.
      fail-fast: false
      matrix:
        # macOS since 2026-10-14: v0.1.0 ships two osx binaries and #110 needs a real Mac run.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # backends doctor --probe now makes a real paid call per installed backend (issue #12); no
      # backend is installed on a CI runner anyway, but this keeps the test suite from ever depending
      # on that and from spending money the moment one is.
      CLAUSTRUM_SKIP_PROBE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet format --verify-no-changes
      - run: dotnet test --configuration Release

  aot-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: dotnet publish src/Claustrum/Claustrum.csproj -c Release -r linux-x64 -p:PublishAot=true -warnaserror
      - run: ./src/Claustrum/bin/Release/net10.0/linux-x64/publish/claustrum --version
